<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Radlwetter</title>
  <meta name="description" content="Wettervorschau fürs Rennrad: 48 Stunden, nur Tageslicht, mit Ampel.">
  <meta name="theme-color" content="#131419">
  <meta name="color-scheme" content="dark">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-32.png" sizes="32x32" type="image/png">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Radlwetter">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="kopf">
    <h1>
      <svg class="logo" viewBox="0 0 64 40" aria-hidden="true"><use href="#rad"/></svg>
      Radlwetter
    </h1>
    <div class="kopf-rechts">
      <button id="ortBtn" class="chip" type="button" aria-label="Ort ändern">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22s7-6.2 7-12a7 7 0 1 0-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/></svg>
        <span id="ortName">Moosburg</span>
      </button>
      <button id="neuBtn" class="rund" type="button" aria-label="Wetter neu laden" title="Wetter neu laden">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.6-5.9"/><path d="M20 4v5h-5"/></svg>
      </button>
    </div>
  </header>

  <main>
    <section class="flaeche" aria-live="polite">
      <div id="kopfinfo" class="kopfinfo" hidden>
        <p id="regenausblick" class="regenausblick"></p>
        <ul id="fenster" class="fenster"></ul>
        <p id="modellhinweis" class="modellhinweis"></p>
      </div>
      <div id="rahmen" class="rahmen" tabindex="0" role="region" aria-label="Wettertabelle, horizontal verschiebbar">
        <table id="tafel"></table>
      </div>
      <ul class="legende" aria-label="Legende">
        <li><span class="amp top" data-s="top"></span>besonders gut</li>
        <li><span class="amp gruen" data-s="gruen"></span>gut</li>
        <li><span class="amp gelb" data-s="gelb"></span>mäßig</li>
        <li><span class="amp rot" data-s="rot"></span>schlecht</li>
      </ul>
      <ul class="legende zweit" aria-label="Weitere Symbole">
        <li><span class="gruende-demo"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-regen"/></svg><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-wind"/></svg><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-temp"/></svg></span>Grund der Farbe: Regen, Wind, Temperatur</li>
        <li><span class="badge demo">?</span>Wettermodelle beim Regen uneinig</li>
        <li><span class="viertel demo" aria-hidden="true"><i class="nass" style="height:9px"></i><i class="nass" style="height:20px"></i><i></i><i></i></span>Regen je Viertelstunde</li>
      </ul>
      <p id="status" class="status"></p>
    </section>
  </main>

  <footer class="fuss">
    <span>Radlwetter v<span id="ver"></span> · Daten: Open-Meteo</span>
    <button id="updBtn" class="text" type="button">Nach Update suchen</button>
  </footer>

  <dialog id="ortDlg">
    <form method="dialog" id="ortForm" class="dlg">
      <h2>Ort wählen</h2>
      <div class="suche">
        <input id="ortSuche" type="search" placeholder="Ort suchen, z. B. Freising" autocomplete="off" enterkeyhint="search" aria-label="Ort suchen">
        <button id="ortSuchBtn" type="button" class="knopf">Suchen</button>
      </div>
      <ul id="ortListe" class="ortliste"></ul>
      <p id="ortHinweis" class="hinweis"></p>
      <div class="dlg-knoepfe">
        <button id="ortGps" type="button" class="knopf">Mein Standort</button>
        <button id="ortStandard" type="button" class="knopf">Moosburg (Standard)</button>
        <button value="cancel" class="knopf zu">Schließen</button>
      </div>
    </form>
  </dialog>

  <!-- Gemeinsames Symbol: stilisiertes Rennrad (nimmt die Textfarbe) -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="rad" viewBox="0 0 64 40">
      <g fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="13" cy="28" r="9"/>
        <circle cx="51" cy="28" r="9"/>
        <path d="M13 28 L27 28 L22 12 L43 12 L51 28"/>
        <path d="M27 28 L42 13"/>
        <path d="M13 28 L22 12"/>
        <path d="M22 12 L20.5 7 M16 6.5 L25 6.5"/>
        <path d="M43 12 L45 7.5 L49.5 7.5 Q54 7.5 54 11.5 Q54 15 50.5 15"/>
      </g>
    </symbol>
    <!-- Symbole für den Grund einer gelben/roten Ampel -->
    <symbol id="i-regen" viewBox="0 0 24 24">
      <path fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round" d="M12 3.2 C12 3.2 5.8 10.4 5.8 14.6 a6.2 6.2 0 0 0 12.4 0 C18.2 10.4 12 3.2 12 3.2z"/>
    </symbol>
    <symbol id="i-wind" viewBox="0 0 24 24">
      <g fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 9h10.5a3 3 0 1 0-3-3"/>
        <path d="M3 14h15a3 3 0 1 1-3 3"/>
        <path d="M3 19h6"/>
      </g>
    </symbol>
    <symbol id="i-temp" viewBox="0 0 24 24">
      <g fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
        <path d="M10 14.2V5.5a2 2 0 0 1 4 0v8.7a4.2 4.2 0 1 1-4 0z"/>
        <path d="M12 10v6.5"/>
      </g>
    </symbol>
  </svg>

  <script src="config.js"></script>
  <script src="logik.js"></script>
  <script src="app.js"></script>
</body>
</html>
